name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inotify-tools

      - name: Install gitlogue
        run: |
          curl -fsSL https://raw.githubusercontent.com/unhappychoice/gitlogue/main/scripts/install.sh | bash

      - name: Run install script
        run: |
          export INSTALL_DIR="$HOME/.local/bin"
          bash install.sh

      - name: Verify wrappers installed
        run: |
          test -x "$HOME/.local/bin/gitlogue-commits-watch"
          test -x "$HOME/.local/bin/gitlogue-unstaged-watch"

      - name: Test wrapper smoke run
        run: |
          repo="$(mktemp -d)"
          git init "$repo"
          cd "$repo"
          echo "hello" > file.txt
          git add file.txt
          git commit -m "init" -q

          timeout 3 "$HOME/.local/bin/gitlogue-commits-watch" "$repo" &
          pid=$!
          sleep 1
          echo "change" >> file.txt
          git add file.txt
          git commit -m "second" -q
          wait "$pid" || true

          rm -rf "$repo"

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install bash fswatch

      - name: Install gitlogue
        run: |
          curl -fsSL https://raw.githubusercontent.com/unhappychoice/gitlogue/main/scripts/install.sh | bash

      - name: Run install script
        run: |
          export INSTALL_DIR="$HOME/.local/bin"
          bash install.sh

      - name: Verify wrappers installed
        run: |
          test -x "$HOME/.local/bin/gitlogue-commits-watch"
          test -x "$HOME/.local/bin/gitlogue-unstaged-watch"

      - name: Test wrapper smoke run
        run: |
          repo="$(mktemp -d)"
          git init "$repo"
          cd "$repo"
          echo "hello" > file.txt
          git add file.txt
          git commit -m "init" -q

          timeout 3 "$HOME/.local/bin/gitlogue-commits-watch" "$repo" &
          pid=$!
          sleep 1
          echo "change" >> file.txt
          git add file.txt
          git commit -m "second" -q
          wait "$pid" || true

          rm -rf "$repo"
