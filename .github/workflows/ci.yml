name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inotify-tools

      - name: Install gitlogue
        run: |
          cargo install gitlogue

      - name: Run install script
        run: |
          export INSTALL_DIR="$HOME/.local/bin"
          bash install.sh

      - name: Verify wrappers installed
        run: |
          test -x "$HOME/.local/bin/gitlogue-commits-watch"
          test -x "$HOME/.local/bin/gitlogue-unstaged-watch"

      - name: Test unstaged wrapper smoke run
        run: |
          repo="$(mktemp -d)"
          cd "$repo"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI"
          echo "hello" > file.txt
          git add file.txt
          git commit -m "init" -q

          timeout 3 "$HOME/.local/bin/gitlogue-unstaged-watch" "$repo" &
          pid=$!
          sleep 1
          echo "change" >> file.txt
          wait "$pid" || true

          rm -rf "$repo"

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install dependencies
        run: |
          brew install bash fswatch

      - name: Install gitlogue
        run: |
          cargo install gitlogue

      - name: Run install script
        run: |
          export INSTALL_DIR="$HOME/.local/bin"
          bash install.sh

      - name: Verify wrappers installed
        run: |
          test -x "$HOME/.local/bin/gitlogue-commits-watch"
          test -x "$HOME/.local/bin/gitlogue-unstaged-watch"

      - name: Test unstaged wrapper smoke run
        run: |
          repo="$(mktemp -d)"
          cd "$repo"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI"
          echo "hello" > file.txt
          git add file.txt
          git commit -m "init" -q

          timeout 3 "$HOME/.local/bin/gitlogue-unstaged-watch" "$repo" &
          pid=$!
          sleep 1
          echo "change" >> file.txt
          wait "$pid" || true

          rm -rf "$repo"
